# 所有网站链接。常用网站、底部分类导航和本地搜索都读这里。常用网站优先显示最近点开过的，不够时用 favorite: true 的补上。
# 这是站点默认的导航：登录用户可以在设置页（/settings#links）编辑自己的分类和网站，存过之后那个账号就不再读这里。
#   icon：可选。不填就按网址域名自动取 favicon（默认 https://a.favicon.im/<域名>?larger=true）
#         想固定图标才填：站内路径（public/ 下，如 /icons/github.svg）或 https 图片地址
#   iconDark：深色模式用的图标（深色图形在深色底上看不清时填，比如 GitHub）
#   category：对应 categories 里的 id；不填则只参与搜索
#   keywords：额外搜索词，比如拼音缩写
# categories 的顺序就是分类导航的顺序；tone 可选 neutral / pink / blue / purple / green / peach / slate。
# 分类按用途划分，尽量不设「其他」这种杂项分组：放不进去的链接可以不填 category，只参与搜索。
# faviconService：换个图标服务，模板里用 {host} 占位符（不填就用默认的 favicon.im）。
#
# 日常加一条链接只写这一行就够了：
#   - { name: 哔哩哔哩, url: https://www.bilibili.com, category: fun, favorite: true }

categories:
  - { id: dev, name: 开发, tone: blue }
  - { id: work, name: 办公, tone: purple }
  - { id: ai, name: AI, tone: peach }
  - { id: fun, name: 娱乐, tone: green }
  - { id: life, name: 生活, tone: pink }

# 下面是给新账号看的通用示例，登录后可以在设置页换成自己的
links:
  # 开发
  - name: GitHub
    url: https://github.com
    icon: /icons/github.svg
    iconDark: /icons/github-light.svg
    category: dev
    favorite: true
  - name: Stack Overflow
    url: https://stackoverflow.com
    category: dev
  - name: MDN
    url: https://developer.mozilla.org/zh-CN/
    category: dev
    keywords: [mdn, docs]

  # 办公
  - name: Gmail
    url: https://mail.google.com/
    icon: /icons/gmail.svg
    category: work
    favorite: true
  - name: Google 日历
    url: https://calendar.google.com/calendar/
    icon: /icons/google-calendar.svg
    category: work
  - name: 百度翻译
    url: https://fanyi.baidu.com/
    icon: /icons/google-translate.svg
    category: work
    keywords: [fanyi, translate]

  # AI
  - name: ChatGPT
    url: https://chatgpt.com/
    icon: /icons/chatgpt.svg
    category: ai
    favorite: true
  - name: Claude
    url: https://claude.ai/
    category: ai
  - name: DeepSeek
    url: https://chat.deepseek.com/
    category: ai

  # 娱乐
  - name: 哔哩哔哩
    url: https://www.bilibili.com
    icon: /icons/bilibili.svg
    category: fun
    favorite: true
    keywords: [bilibili, bili]
  - name: YouTube
    url: https://www.youtube.com/
    category: fun
  - name: 网易云音乐
    url: https://music.163.com/
    category: fun
    keywords: [music, wyy]

  # 生活
  - name: 知乎
    url: https://www.zhihu.com/
    category: life
    keywords: [zhihu]
  - name: 高德地图
    url: https://www.amap.com/
    category: life
    keywords: [map, gaode]
  - name: 天气
    url: https://weather.com.cn/
    category: life
    keywords: [tianqi, weather]
